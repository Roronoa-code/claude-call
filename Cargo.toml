[package]
name = "callme"
version = "1.0.0"
edition = "2024"
description = "Lets Claude Code phone you: MCP server, call web server and the shared Cloudflare tunnel, in one binary."

[dependencies]
axum = "0.8"
humantime = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[profile.release]
strip = true

[workspace]
members = ["phone"]
