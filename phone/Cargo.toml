[package]
name = "callme-phone"
version = "1.0.0"
edition = "2024"
description = "Shared native Claude Call screens, chat and call audio for Android and Windows."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glow = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk = { version = "0.9", features = ["audio", "nativewindow", "api-level-28"] }
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }

[target.'cfg(windows)'.dependencies]
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-skia-opengl", "unstable-winit-030"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Graphics_Imaging", "Storage_Streams", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[build-dependencies]
slint-build = "1.18"
