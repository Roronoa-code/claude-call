<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude call</title>
<style>
  :root { --bg: #111214; --fg: #f2f2f3; --muted: #9a9ca3; --accent: #d97757; --ok: #3fb950; --bad: #e5534b; --me: #2f4f7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; padding: max(24px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  header { text-align: center; margin-top: 4vh; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--accent); margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 40px; font-weight: 600;
    box-shadow: 0 0 0 calc(var(--level, 0) * 22px) #3fb95055; transition: box-shadow 90ms linear; }
  .avatar.pulse { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #d9775799; } 100% { box-shadow: 0 0 0 26px #d9775700; } }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  #status { color: var(--muted); margin-top: 4px; min-height: 1.45em; }
  #log { flex: 1; overflow-y: auto; margin: 24px 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .claude { background: #24262b; align-self: flex-start; border-bottom-left-radius: 6px; }
  .me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 6px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: #1c1d21; color: var(--fg); border: 1px solid #2c2e33; border-radius: 22px; padding: 11px 16px; font: inherit; }
  button { border: 0; border-radius: 22px; padding: 11px 18px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .send { background: var(--me); }
  .answer { display: block; width: 76px; height: 76px; border-radius: 50%; background: var(--ok); margin: 0 auto 4vh; font-size: 30px; padding: 0; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  .done { background: var(--ok); }
  .mute { background: #3a3c42; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="avatar pulse" id="avatar">C</div>
  <h1>Claude</h1>
  <div id="status">Incoming call</div>
</header>
<div id="log"></div>
<button class="answer" id="answer" aria-label="Answer call">📞</button>
<div id="controls" hidden>
  <form id="form"><input id="text" placeholder="Or type a reply" autocomplete="off"><button class="send">Send</button></form>
  <div class="row">
    <button class="mute" id="mute">Mute mic</button>
    <button class="mute" id="speaker" hidden>Speaker</button>
    <button class="done" id="done" disabled>Done talking</button>
  </div>
</div>
<script src="call-engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const bubbles = {};
function bubble(key, text, who) {
  let el = bubbles[key];
  if (!el) { el = bubbles[key] = Object.assign(document.createElement('div'), { className: `msg ${who}` }); $('log').append(el); }
  el.textContent = text; el.scrollIntoView({ block: 'end' });
  return el;
}
const call = CallEngine({
  token: new URLSearchParams(location.search).get('t'),
  on: {
    status: s => { $('status').textContent = s; },
    busy: on => $('avatar').classList.toggle('pulse', on),
    level: x => document.body.style.setProperty('--level', x.toFixed(2)),
    canFinish: on => { $('done').disabled = !on; },
    claude: l => bubble('c' + l.id, '', 'claude'),          // Claude's words appear as the voice says them
    playing: l => bubble('c' + l.id, l.shown, 'claude'),
    partial: u => bubble('u' + u.id, u.text, 'me'),         // live caption while you talk
    heard: u => { if (u.text) bubble('u' + u.id, u.text, 'me'); else bubbles['u' + u.id]?.remove(); },
    muted: on => { $('mute').textContent = on ? 'Unmute mic' : 'Mute mic'; },
    ended: () => { $('controls').hidden = true; },
  },
});
$('answer').onclick = () => { $('answer').hidden = true; $('controls').hidden = false; call.answer(); };
if (call.hasSpeaker) {
  $('speaker').hidden = false;
  $('speaker').onclick = () => { $('speaker').textContent = call.setSpeaker(!call.speaker) ? 'Earpiece' : 'Speaker'; };
}
$('done').onclick = () => call.finish();
$('form').onsubmit = e => { e.preventDefault(); call.sendTyped($('text').value); $('text').value = ''; };
$('mute').onclick = () => call.setMuted(!call.muted);
// Answer straight away when opened from the app's call screen.
if (new URLSearchParams(location.search).has('auto')) $('answer').click();
</script>
</body>
</html>
