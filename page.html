<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude call</title>
<style>
  :root { --bg: #111214; --fg: #f2f2f3; --muted: #9a9ca3; --accent: #d97757; --ok: #3fb950; --bad: #e5534b; --me: #2f4f7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; padding: max(24px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  header { text-align: center; margin-top: 4vh; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--accent); margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 40px; font-weight: 600;
    box-shadow: 0 0 0 calc(var(--level, 0) * 22px) #3fb95055; transition: box-shadow 90ms linear; }
  .avatar.pulse { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #d9775799; } 100% { box-shadow: 0 0 0 26px #d9775700; } }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  #status { color: var(--muted); margin-top: 4px; min-height: 1.45em; }
  #log { flex: 1; overflow-y: auto; margin: 24px 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .claude { background: #24262b; align-self: flex-start; border-bottom-left-radius: 6px; }
  .me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 6px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: #1c1d21; color: var(--fg); border: 1px solid #2c2e33; border-radius: 22px; padding: 11px 16px; font: inherit; }
  button { border: 0; border-radius: 22px; padding: 11px 18px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .send { background: var(--me); }
  .answer { display: block; width: 76px; height: 76px; border-radius: 50%; background: var(--ok); margin: 0 auto 4vh; font-size: 30px; padding: 0; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  .done { background: var(--ok); }
  .mute { background: #3a3c42; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="avatar pulse" id="avatar">C</div>
  <h1>Claude</h1>
  <div id="status">Incoming call</div>
</header>
<div id="log"></div>
<button class="answer" id="answer" aria-label="Answer call">📞</button>
<div id="controls" hidden>
  <form id="form"><input id="text" placeholder="Or type a reply" autocomplete="off"><button class="send">Send</button></form>
  <div class="row">
    <button class="mute" id="mute">Mute mic</button>
    <button class="mute" id="speaker" hidden>Speaker</button>
    <button class="done" id="done" disabled>Done talking</button>
  </div>
</div>
<script>
const t = new URLSearchParams(location.search).get('t');
const api = p => `${p}?t=${t}`;
const $ = id => document.getElementById(id);
const SILENCE_MS = 1800, PREROLL_MS = 400, MAX_MS = 90_000;
let lastSeq = null, muted = false, ended = false, busy = false;
let listening = false, talking = false, segment = [], preroll = [], quietSince = 0, startedAt = 0, noiseFloor = 0.01;
let ctx = null, rate = 48000, micStream = null;
// Interrupting: while Claude talks, the mic keeps watching; ~250 ms of clear speech stops Claude and starts listening.
let speaking = false, interrupted = false, bargeFrames = 0;

const status = s => { $('status').textContent = s; };
function bubble(text, who) {
  const el = Object.assign(document.createElement('div'), { className: `msg ${who}`, textContent: text });
  $('log').append(el); el.scrollIntoView({ block: 'end' }); return el;
}
const pulse = on => $('avatar').classList.toggle('pulse', on);

// ---- Claude's voice ----
const player = new Audio();
const app = window.CallMeApp; // present inside the Claude Call app: plays through the earpiece like a phone call
const appWaits = {};
window.__played = (id, ok) => { appWaits[id]?.(ok); delete appWaits[id]; };
// Plays one sentence of a line (part `i` of line `seq`).
function play(seq, i, text) {
  const url = new URL(`${api('audio')}&seq=${seq}&part=${i}`, location.href).href;
  if (app) return new Promise(res => {
    const id = seq * 1000 + i;
    appWaits[id] = res;
    setTimeout(() => window.__played(id, true), 15000 + text.split(/\s+/).length * 600); // never hang the call
    app.play(url, id);
  });
  return new Promise(res => {
    const backup = setTimeout(done, 5000 + text.split(/\s+/).length * 600);
    function done() { clearTimeout(backup); player.onended = player.onerror = null; res(true); }
    player.onended = done;
    player.onerror = () => { clearTimeout(backup); res(false); };
    player.src = url;
    player.play().catch(() => { clearTimeout(backup); res(false); });
  });
}
const getState = async () => (await fetch(api('state'), { cache: 'no-store' })).json();
// Plays a line sentence by sentence, starting as soon as the first is ready.
async function speakLine(s) {
  interrupted = false; speaking = true; bargeFrames = 0; preroll = [];
  try {
    for (let i = 0; i < s.parts.length && !interrupted; i++) {
      let st = s;
      while (st.seq === s.seq && st.ready <= i && !interrupted) { await new Promise(r => setTimeout(r, 150)); st = await getState(); }
      if (st.seq !== s.seq || interrupted) return; // replaced by a newer line, or the user cut in
      if (!await play(s.seq, i, s.parts[i]) && !interrupted) await speakBrowser(s.parts[i]);
    }
  } finally { speaking = false; }
}
function stopPlayback() {
  if (app?.stop) app.stop();
  for (const id in appWaits) window.__played(Number(id), true);
  player.pause(); player.onended?.();
  speechSynthesis.cancel();
}
function interrupt(now) {
  interrupted = true; speaking = false; stopPlayback();
  listening = true; talking = true; segment = [...preroll]; preroll = [];
  startedAt = quietSince = now;
  status('Hearing you…'); pulse(false); $('done').disabled = false;
}
function speakBrowser(text) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    const backup = setTimeout(res, 2000 + text.split(/\s+/).length * 450);
    u.onend = u.onerror = () => { clearTimeout(backup); res(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}

// ---- Your voice: record on the phone, transcribe on the PC (Whisper) ----
async function startMic() {
  const stream = micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new AudioContext(); rate = ctx.sampleRate;
  const src = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 1, 1);
  src.connect(node); node.connect(ctx.destination);
  node.onaudioprocess = e => {
    const buf = new Float32Array(e.inputBuffer.getChannelData(0));
    let sum = 0; for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    if (!listening) {
      if (speaking && !muted) {
        // Claude's own voice leaks back a little even with echo cancelling, so this needs clearly louder speech.
        preroll.push(buf);
        while (preroll.length * 4096 / rate * 1000 > PREROLL_MS) preroll.shift();
        bargeFrames = rms > Math.max(0.035, noiseFloor * 6) ? bargeFrames + 1 : 0;
        if (bargeFrames >= 3) interrupt(performance.now());
      } else if (!speaking) noiseFloor = noiseFloor * 0.95 + rms * 0.05;
      return;
    }
    const speech = rms > Math.max(0.012, noiseFloor * 3);
    document.body.style.setProperty('--level', talking ? Math.min(1, rms * 12).toFixed(2) : 0);
    const now = performance.now();
    if (!talking) {
      if (!speech) noiseFloor = noiseFloor * 0.95 + rms * 0.05;
      preroll.push(buf);
      while (preroll.length * 4096 / rate * 1000 > PREROLL_MS) preroll.shift();
      if (speech) { talking = true; segment = [...preroll]; preroll = []; startedAt = now; quietSince = now; status('Hearing you…'); $('done').disabled = false; }
      return;
    }
    segment.push(buf);
    if (speech) quietSince = now;
    if (now - quietSince > SILENCE_MS || now - startedAt > MAX_MS) finishSpeech();
  };
}
function listen() {
  if (muted || ended || !ctx) { status(ctx ? 'Mic muted, type a reply' : 'Type your reply'); return; }
  ctx.resume(); listening = true; talking = false; segment = []; preroll = [];
  status('Listening… take your time'); pulse(false);
}
function stopListening() { listening = false; talking = false; segment = []; $('done').disabled = true; document.body.style.setProperty('--level', 0); }
function to16k(chunks) {
  const len = chunks.reduce((n, c) => n + c.length, 0), all = new Float32Array(len);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const ratio = rate / 16000, out = new Float32Array(Math.floor(len / ratio));
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b; j++) s += all[j];
    out[i] = s / Math.max(1, b - a);
  }
  return out;
}
async function finishSpeech() {
  const chunks = segment, cutIn = interrupted; stopListening(); interrupted = false;
  status('Got it, transcribing…'); pulse(true);
  try {
    const r = await fetch(`${api('speech')}${cutIn ? '&interrupted=1' : ''}`, { method: 'POST', body: to16k(chunks).buffer });
    const { text } = await r.json();
    if (text) { bubble(text, 'me'); status('Claude is thinking…'); }
    else listen(); // only noise: keep listening
  } catch { status('Could not send audio, type instead'); }
}
async function sendTyped(text) {
  text = text.trim(); if (!text) return;
  stopListening(); bubble(text, 'me');
  status('Claude is thinking…'); pulse(true);
  await fetch(api('reply'), { method: 'POST', body: text });
}

async function poll() {
  if (ended) return;
  try {
    const s = await getState();
    if (!s.say) status('Connecting…');
    else if (s.seq !== lastSeq && !busy) {
      busy = true; lastSeq = s.seq; stopListening();
      bubble(s.say, 'claude'); status('Claude is talking…'); pulse(true);
      await speakLine(s);
      busy = false;
      if (interrupted && !s.end) { setTimeout(poll, 700); return; } // already listening to the user
      if (s.end) {
        ended = true; status('Call ended'); pulse(false); $('controls').hidden = true;
        micStream?.getTracks().forEach(tr => tr.stop()); ctx?.close(); // release the mic
        if (app) setTimeout(() => app.ended(), 1200);
        return;
      }
      listen();
    }
  } catch { status('Reconnecting…'); }
  setTimeout(poll, 700);
}

$('answer').onclick = async () => {
  // Audio playback must first start from a tap on mobile.
  player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  player.play().catch(() => {});
  $('answer').hidden = true; $('controls').hidden = false; status('Connected');
  try { await startMic(); } catch { muted = true; $('mute').textContent = 'Unmute mic'; }
  fetch(api('answer'), { method: 'POST' }); poll();
};
if (app) {
  $('speaker').hidden = false;
  $('speaker').onclick = () => {
    const on = !app.isSpeaker(); app.setSpeaker(on);
    $('speaker').textContent = on ? 'Earpiece' : 'Speaker';
  };
}
$('done').onclick =() => { if (talking) finishSpeech(); };
$('form').onsubmit = e => { e.preventDefault(); sendTyped($('text').value); $('text').value = ''; };
$('mute').onclick = async () => {
  if (!ctx) { try { await startMic(); } catch { status('Mic blocked, type a reply'); return; } }
  muted = !muted; $('mute').textContent = muted ? 'Unmute mic' : 'Mute mic';
  if (muted) { stopListening(); status('Mic muted, type a reply'); } else if (!busy) listen();
};
// Answer straight away when opened from the app's call screen.
if (new URLSearchParams(location.search).has('auto')) $('answer').click();
</script>
</body>
</html>
